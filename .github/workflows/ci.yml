name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: quality gates
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt gate
        run: make fmt

      - name: go vet gate
        run: make vet

      - name: unit tests (race)
        run: make test

      - name: coverage gate
        run: make cover

      - name: smoke tests
        run: make smoke

      - name: end-to-end tests
        run: make e2e

      - name: e2e binary coverage (report only)
        run: make cover-e2e

  build:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build all platforms
        run: |
          GOOS=linux   GOARCH=amd64 go build -o /dev/null ./cmd/tape
          GOOS=linux   GOARCH=arm64 go build -o /dev/null ./cmd/tape
          GOOS=darwin  GOARCH=amd64 go build -o /dev/null ./cmd/tape
          GOOS=darwin  GOARCH=arm64 go build -o /dev/null ./cmd/tape
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/tape
